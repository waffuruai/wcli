# Waffuru org rustfmt config (stable): one copy shared by every Rust repo.
#
# Stable-only: no `unstable_features`, so `cargo fmt` produces identical
# output under any rustfmt on $PATH (Homebrew stable, rustup stable, CI)
# — no nightly pin, no binary-path gymnastics. Every key below is
# accepted by stable rustfmt without an "unstable" warning.
use_small_heuristics = "Max"
max_width = 120

# Imports
reorder_imports = true
reorder_modules = true
remove_nested_parens = true

# Compact match arms
match_block_trailing_comma = true
match_arm_leading_pipes = "Never"

# Misc compaction
use_field_init_shorthand = true
use_try_shorthand = true
merge_derives = true

# Layout
newline_style = "Unix"
hard_tabs = false
tab_spaces = 4

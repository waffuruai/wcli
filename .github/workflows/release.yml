name: Release

# A vX.Y.Z tag on main publishes a GitHub Release with generated notes, after
# the tag's version matches Cargo.toml and the crate packages. Publishing to
# crates.io is by hand for now (README.md, Releasing).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The tag is on main and matches Cargo.toml
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] ||
            { echo "::error::Cargo.toml says $version, the tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: test and package
        run: |
          cargo test --locked
          cargo package --locked

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/package/wcli-*.crate \
            --verify-tag --title "wcli $GITHUB_REF_NAME" --generate-notes ||
            gh release upload "$GITHUB_REF_NAME" target/package/wcli-*.crate --clobber
